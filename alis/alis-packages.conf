# alis package configuration for this setup - https://github.com/picodotdev/alis
#
# PACKAGES_PACMAN_CUSTOM below is packages.txt, flattened. It is generated, not
# maintained by hand - regenerate it after editing packages.txt with:
#
#   sed 's/#.*//' packages.txt | grep -v '^[[:space:]]*$' | tr -d ' ' | tr '\n' ' '
#
# Everything alis offers by category is left off: this system's package list is
# the one in packages.txt and nothing else, so there is exactly one place to
# change it.

# init
LOG_TRACE="true"
LOG_FILE="true"

# pacman
PACKAGES_PACMAN_INSTALL="true"
# The PipeWire set is already in the custom list below, with pipewire-alsa,
# which this option does not install.
PACKAGES_PACMAN_INSTALL_PIPEWIRE="false"
PACKAGES_PACMAN_INTERNET=""
PACKAGES_PACMAN_MULTIMEDIA=""
PACKAGES_PACMAN_UTILITIES=""
PACKAGES_PACMAN_DOCUMENTS_AND_TEXT=""
PACKAGES_PACMAN_COMMUNICATION=""
PACKAGES_PACMAN_GAMES=""
PACKAGES_PACMAN_SECURITY=""
PACKAGES_PACMAN_SCIENCE=""
PACKAGES_PACMAN_OTHERS=""
# git and base-devel are not part of the session, they are what gets this
# repository onto the machine and what yay needs to build anything.
PACKAGES_PACMAN_DEVELOPER="git base-devel"
PACKAGES_PACMAN_CUSTOM="hyprland hyprlock hypridle swaybg hyprcursor uwsm xdg-desktop-portal-hyprland waybar mako fuzzel alacritty nemo cliphist wl-clipboard grim slurp hyprpicker playerctl pipewire wireplumber pipewire-pulse pipewire-alsa alsa-utils bluez bluez-utils brightnessctl polkit-gnome fish starship neovim ripgrep fd unzip tlp throttled jq libnotify networkmanager ffmpeg python-gobject gtk-layer-shell adwaita-icon-theme inter-font ttf-jetbrains-mono-nerd noto-fonts noto-fonts-emoji qt5-wayland qt6-wayland ly btop"
PACKAGES_PACMAN_PIPEWIRE=""
PACKAGES_PACMAN_CUSTOM_REPOSITORIES=""

# flatpak
# Every category is spelled out even though all of them are empty and the
# installer is off: alis runs under `set -u`, so a variable it happens to read
# on some path and this file never defines ends the run.
PACKAGES_FLATPAK_INSTALL="false"
PACKAGES_FLATPAK_INTERNET=""
PACKAGES_FLATPAK_MULTIMEDIA=""
PACKAGES_FLATPAK_UTILITIES=""
PACKAGES_FLATPAK_DOCUMENTS_AND_TEXT=""
PACKAGES_FLATPAK_COMMUNICATION=""
PACKAGES_FLATPAK_GAMES=""
PACKAGES_FLATPAK_SECURITY=""
PACKAGES_FLATPAK_SCIENCE=""
PACKAGES_FLATPAK_OTHERS=""
PACKAGES_FLATPAK_DEVELOPER=""
PACKAGES_FLATPAK_CUSTOM=""

# sdkman
PACKAGES_SDKMAN_INSTALL="false"
PACKAGES_SDKMAN_JDKS=""
PACKAGES_SDKMAN_SDKS=""

# aur
# The three menus behind the Bluetooth, audio and Wi-Fi keys. None is required
# for the session to come up - each has a fallback script in hypr/scripts -
# but they are what the keybinds open first.
PACKAGES_AUR_INSTALL="true"
PACKAGES_AUR_COMMAND="yay-bin"
PACKAGES_AUR_INTERNET=""
PACKAGES_AUR_MULTIMEDIA=""
PACKAGES_AUR_UTILITIES=""
PACKAGES_AUR_DOCUMENTS_AND_TEXT=""
PACKAGES_AUR_COMMUNICATION=""
PACKAGES_AUR_GAMES=""
PACKAGES_AUR_SECURITY=""
PACKAGES_AUR_SCIENCE=""
PACKAGES_AUR_OTHERS=""
PACKAGES_AUR_DEVELOPER=""
PACKAGES_AUR_CUSTOM="bzmenu-bin pwmenu-bin networkmanager-dmenu-git"

PACKAGES_PACMAN="$PACKAGES_PACMAN_INTERNET $PACKAGES_PACMAN_MULTIMEDIA $PACKAGES_PACMAN_UTILITIES $PACKAGES_PACMAN_DOCUMENTS_AND_TEXT $PACKAGES_PACMAN_COMMUNICATION $PACKAGES_PACMAN_GAMES $PACKAGES_PACMAN_SECURITY $PACKAGES_PACMAN_SCIENCE $PACKAGES_PACMAN_OTHERS $PACKAGES_PACMAN_DEVELOPER $PACKAGES_PACMAN_CUSTOM"
PACKAGES_FLATPAK="$PACKAGES_FLATPAK_CUSTOM"
PACKAGES_SDKMAN=""
PACKAGES_AUR="$PACKAGES_AUR_INTERNET $PACKAGES_AUR_MULTIMEDIA $PACKAGES_AUR_UTILITIES $PACKAGES_AUR_DOCUMENTS_AND_TEXT $PACKAGES_AUR_COMMUNICATION $PACKAGES_AUR_GAMES $PACKAGES_AUR_SECURITY $PACKAGES_AUR_SCIENCE $PACKAGES_AUR_OTHERS $PACKAGES_AUR_DEVELOPER $PACKAGES_AUR_CUSTOM"

# systemd
SYSTEMD_UNITS=""
