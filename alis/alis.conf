# alis configuration for this setup - https://github.com/picodotdev/alis
#
# Installs Arch the way the machine running these dotfiles is installed: no
# disk encryption, no desktop environment, ext4 on a single disk, and the
# package list from packages.txt. After the reboot, clone this repository and
# run ./install.sh - alis lays the system down, install.sh puts the session on
# top of it.
#
#   pacman -Sy --noconfirm git
#   git clone https://github.com/1mirax/hyprliquid-dotfiles
#   cd hyprliquid-dotfiles/alis && curl -O https://raw.githubusercontent.com/picodotdev/alis/master/alis.sh
#   chmod +x alis.sh && ./alis.sh
#
# A value preceded by ! is ignored - that is how alis comments out an option.

# init
KEYS="us"
LOG_TRACE="true"
LOG_FILE="true"

# partition
#
# !!  CHECK THIS FIRST. `auto` picks the first internal disk it finds, and
# !!  PARTITION_MODE="auto" then deletes every partition on it. Run `lsblk`
# !!  from the live image, find the disk you mean - the installation USB will
# !!  be in that list too - and write it here explicitly if there is any doubt.
# eMMC, named explicitly rather than left to `auto`: with an installation USB
# plugged in there is more than one candidate, and this one is destructive.
# mmcblk0boot0 and mmcblk0boot1 in the same listing are the eMMC's own 4 MB
# hardware boot areas - they are not partitions of the disk, nothing is
# installed to them, and they are left alone.
DEVICE="/dev/mmcblk0 !auto !/dev/nvme0n1 !/dev/sda" # (single)
DEVICE_TRIM="true"
LVM="false"
# No encryption, deliberately: this is a machine that gets picked up and used,
# not one that carries anything worth a passphrase at every boot.
LUKS_PASSWORD=""
LUKS_PASSWORD_RETYPE=""
FILE_SYSTEM_TYPE="ext4"
BTRFS_SUBVOLUMES_MOUNTPOINTS=()
# A swap file rather than a partition: hypridle only suspends, nothing here
# hibernates, so this is overflow rather than a memory image. 2 GB because the
# smaller machine is 4 GB of RAM on a small eMMC, where the file costs disk
# that is actually scarce. On a roomy disk 4096 is the better number.
SWAP_SIZE="2048"
PARTITION_MODE="auto"
PARTITION_MOUNT_POINTS=("1=/boot" "2=/")
PARTITION_CUSTOM_PARTED_UEFI="mklabel gpt mkpart ESP fat32 1MiB 1024MiB mkpart root $FILE_SYSTEM_TYPE 1024MiB 100% set 1 esp on"
PARTITION_CUSTOM_PARTED_BIOS="mklabel msdos mkpart primary ext4 4MiB 1024MiB mkpart primary $FILE_SYSTEM_TYPE 1024MiB 100% set 1 boot on"
GPT_AUTOMOUNT="false"

# network_install
# Wired needs nothing here. For Wi-Fi, fill the interface and SSID in and alis
# will ask for the key rather than keeping it in a file that lives in git.
WIFI_INTERFACE=""
WIFI_ESSID=""
WIFI_KEY="ask"
WIFI_KEY_RETYPE="ask"
PING_HOSTNAME="archlinux.org"

# install
REFLECTOR="true"
REFLECTOR_COUNTRIES=("Russia" "Finland" "Germany")
PACMAN_MIRROR="https://mirrors.kernel.org/archlinux/\$repo/os/\$arch"
PACMAN_PARALLEL_DOWNLOADS="true"
KERNELS=""
KERNELS_COMPRESSION="auto"
KERNELS_PARAMETERS=""

# aur
AUR_PACKAGE="yay-bin !paru-bin !paru !yay !aurman" # (single)

# display driver
# auto resolves to the Intel driver on both machines this is used on. Video
# acceleration matters more on the weaker one, not less.
DISPLAY_DRIVER="auto"
KMS="true"
FASTBOOT="true"
FRAMEBUFFER_COMPRESSION="true"
DISPLAY_DRIVER_DDX="false"
VULKAN="true"
DISPLAY_DRIVER_HARDWARE_VIDEO_ACCELERATION="true"
DISPLAY_DRIVER_HARDWARE_VIDEO_ACCELERATION_INTEL="intel-media-driver"

# config
TIMEZONE="/usr/share/zoneinfo/Europe/Moscow"
# System messages in English, Russian available for content. This is the same
# split the dotfiles keep: interface and logs read in English everywhere.
LOCALES=("en_US.UTF-8 UTF-8" "ru_RU.UTF-8 UTF-8")
LOCALE_CONF=("LANG=en_US.UTF-8")
# Two groups with Alt+Shift between them - the same pair hypr/modules/
# settings.lua sets for the session, so the console and the compositor agree.
KEYLAYOUT="us,ru"
KEYMODEL=""
KEYVARIANT=""
KEYOPTIONS="grp:alt_shift_toggle"
KEYMAP="KEYMAP=us"
FONT=""
FONT_MAP=""
HOSTNAME="archlinux"
ROOT_PASSWORD="ask"
ROOT_PASSWORD_RETYPE="ask"

# user
USER_NAME="eclipse"
USER_PASSWORD="ask"
USER_PASSWORD_RETYPE="ask"
ADDITIONAL_USERS=()

SYSTEMD_HOMED="false"
SYSTEMD_HOMED_STORAGE="directory"
SYSTEMD_HOMED_STORAGE_LUKS_TYPE="auto"
SYSTEMD_HOMED_STORAGE_CIFS_DOMAIN=""
SYSTEMD_HOMED_STORAGE_CIFS_SERVICE=""

# mkinitcpio
HOOKS="base udev autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck"
MODULES=""
UKI="false"
PLYMOUTH="false"
PLYMOUTH_THEME="auto"

# bootloader
# auto is systemd-boot on UEFI, which is what both machines boot.
BOOTLOADER="auto"
SECURE_BOOT="false"

# shell
# fish, because fish_prompt.fish and the palette in config.fish assume it.
CUSTOM_SHELL="fish"

# desktop
# None of them. Hyprland comes from the package list below and the session
# comes from this repository; a desktop environment here would pull a second
# one of everything - its own bar, notifier, portal and settings daemon.
DESKTOP_ENVIRONMENT=""
# Same reason: ly is in the package list and is enabled under SYSTEMD_UNITS.
# alis only knows the four X11-era managers, none of which belong here.
DISPLAY_MANAGER=""

# packages
PACKAGES_MULTILIB="false"

# provision
PROVISION="false"

# misc
FWUPD="false"
VAGRANT="false"

# systemd
# ly@tty2 is the login prompt - pick "Hyprland (uwsm)" there, not plain
# "Hyprland", or the daemons fall back to the Lua autostart path.
# bluetooth.service stays enabled on purpose even though the adapter is left
# powered off: power/install.sh sets AutoEnable=false, so the service is what
# lets the menu turn the adapter on at all.
SYSTEMD_UNITS="+NetworkManager.service +ly@tty2.service +bluetooth.service"

# reboot
# Left to you: read the log, check `lsblk` and the bootloader entry, then
# reboot by hand.
REBOOT="false"
