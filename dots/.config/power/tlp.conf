# TLP - ThinkPad X390 Yoga, i5-8265U (Whiskey Lake), intel_pstate.
# Only deviations from /usr/share/tlp/defaults.conf are listed here.
# Note: this machine has no ACPI platform_profile, so PLATFORM_PROFILE_* is omitted.

TLP_ENABLE=1
TLP_DEFAULT_MODE=BAT
TLP_PERSISTENT_DEFAULT=0

# --- CPU ---
# intel_pstate stays in active mode; powersave here is the full dynamic range,
# not a fixed low clock. Battery savings come from EPP + no turbo.
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active

CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Turbo off on battery is the single biggest win on a 15 W U-series chip.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Uncomment to also cap peak frequency on battery (more runtime, less snap).
#CPU_MAX_PERF_ON_BAT=75

# --- Battery care: deliberately not used ---
# This EC does not honour charge thresholds. Writes to
# charge_control_end_threshold are silently ignored; a write to
# charge_control_start_threshold reads back on both files but only sets the
# resume point, so the battery still charged past 82% with a "80" cap showing.
# Thresholds are therefore left unset and the battery charges to 100%.
# The battery is healthy (101.9% of design capacity), so this costs little.

# --- PCIe / runtime power management ---
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# --- Wi-Fi ---
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# --- Audio ---
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# --- USB ---
# Phones are excluded so charging/tethering is not interrupted.
USB_AUTOSUSPEND=1
USB_EXCLUDE_PHONE=1

# --- Misc ---
NMI_WATCHDOG=0
