# Hand the power button to the compositor instead of acting on it here.
#
# By default logind runs HandlePowerKey=poweroff: one press and the machine
# starts shutting down, with no menu and nothing to cancel. With `ignore` the
# key arrives in the session as XF86PowerOff, where modules/keybinds.lua binds
# it to scripts/power.sh - lock, suspend, log out, reboot, shut down.
#
# The long press is deliberately left as a real power-off: hold the button and
# the machine goes down without asking. That is the escape hatch for a session
# that has stopped answering, which is exactly when a menu is useless.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
