# Hand the power button to the compositor instead of acting on it here.
#
# By default logind runs HandlePowerKey=poweroff: one press and the machine
# starts shutting down, with no menu and nothing to cancel. With `ignore` the
# key arrives in the session as XF86PowerOff, where modules/keybinds.lua binds
# it to scripts/power.sh - lock, suspend, log out, reboot, shut down.
#
# HandlePowerKeyLongPress is ignore as well, and that is not a second thought.
# The rule this setup wants is the simplest one there is: a signal arrives,
# the menu opens. Nothing anywhere counts milliseconds - not logind, not
# scripts/power.sh - because the machines disagree about what a press even is.
#
# On the ThinkPad the embedded controller filters taps: measured with evtest,
# a quick tap produces no input event at all, and a held press produces a
# single 26 microsecond KEY_POWER pulse, so press and release arrive in the
# same instant regardless. Every press that reaches the OS there is already a
# held one, and giving the long press to logind would hand it exactly the
# presses the menu exists to catch. The other machine reports taps happily -
# it used to shut down when the button was brushed while typing, which is the
# reason any of this exists.
#
# The real escape hatch is below both of these anyway: hold the button for
# four to ten seconds and the controller cuts power itself, with no operating
# system involved.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
