# throttled - Intel power-limit tuning for ThinkPad X390 Yoga (i5-8265U).
#
# HWP_Mode is deliberately ABSENT, not False. In throttled's set_hwp():
#   hwp_mode = HWP_PERFORMANCE_VALUE if performance_mode is True else HWP_DEFAULT_VALUE
# so False still writes the 0x80 default to IA32_HWP_REQUEST and clobbers the
# EPP that TLP set. Only a missing key yields fallback=None, which makes
# set_hwp() return without touching the register. TLP then owns EPP, throttled
# owns the package power limits, and the two stop fighting.
#
# Undervolting IS supported here - verified by writing MSR 0x150 and reading
# it back (undervolt-test.sh), despite microcode 0x100 / BIOS 1.85.
#
# Values are deliberately backed off from the tested limit. -115 mV core/cache
# was the last value before a kernel panic, i.e. zero margin: voltage stability
# shifts with temperature, load type (AVX draws far more current) and silicon
# ageing, so a setting that survives a test can panic months later. -90 mV
# keeps roughly 20% headroom and gives up very little of the benefit.

[GENERAL]
Enabled: True
# This ThinkPad names the adapter ADP1, not AC0/AC - the upstream default
# glob AC*/online matches nothing here and throttled falls back to upower.
Sysfs_Power_Path: /sys/class/power_supply/ADP1/online
Autoreload: True

[BATTERY]
Update_Rate_s: 30
# 12 W sustained keeps the fan off and the chassis cool on battery.
PL1_Tdp_W: 12
PL1_Duration_s: 28
PL2_Tdp_W: 20
PL2_Duration_S: 0.002
Trip_Temp_C: 80
cTDP: 0
Disable_BDPROCHOT: False

[AC]
Update_Rate_s: 5
# Stock PL1 is 15 W; 20 W is a modest lift this chassis can actually cool.
PL1_Tdp_W: 20
PL1_Duration_s: 28
PL2_Tdp_W: 35
PL2_Duration_S: 0.002
Trip_Temp_C: 92
cTDP: 0
Disable_BDPROCHOT: False

# CORE and CACHE share a voltage plane on this generation - keep them equal,
# or the lower of the two silently wins.
[UNDERVOLT.BATTERY]
CORE: -90
GPU: -50
CACHE: -90
UNCORE: 0
ANALOGIO: 0

[UNDERVOLT.AC]
CORE: -90
GPU: -50
CACHE: -90
UNCORE: 0
ANALOGIO: 0
