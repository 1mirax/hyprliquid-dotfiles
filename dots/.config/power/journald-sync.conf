# Journald writes what it has buffered to disk every 5 minutes by default.
# A session that hangs after resume ends at the power button, so everything
# logged since the last flush is lost - and that is exactly the window that
# would explain the hang. Ten seconds keeps it, at the cost of a few extra
# writes a minute on a machine that is otherwise idle.
#
# Drop this file once the resume bug is understood.

[Journal]
SyncIntervalSec=10s
