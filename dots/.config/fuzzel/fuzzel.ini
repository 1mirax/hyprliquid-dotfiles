# iOS liquid glass launcher.
#
# Only settings that differ from fuzzel's own defaults are listed. Four
# behaviours are relied on and come for free, so they are not repeated here:
# prompt "> ", icons enabled, match-mode fzf, and exit-on-keyboard-focus-loss
# (which is what makes the launcher impossible to leave stuck on screen).
[main]
font=Inter:size=16.5

# Default is auto, which sizes the font from the monitor's DPI whenever every
# output is at scale 1 - and this panel is 166 DPI, so that would render
# everything enormous. "no" sizes from the scaling factor instead, which is
# what the 16.5 above is calibrated against.
dpi-aware=no

use-bold=yes
icon-theme=Adwaita

# Default is 0.5, which shows a large preview image once the list narrows to a
# few matches. 1 turns that off and keeps every row the same height.
image-size-ratio=1

# Applications that ship only a huge PNG make every open slower - AmneziaVPN's
# 512x512 logo alone cost 34 ms of a 90 ms startup. Small copies under
# ~/.local/share/icons take precedence over /usr/share and fix that. They are
# generated, not hand-made: run ~/.config/hypr/scripts/fix-oversized-icons.py
# after a fresh install or when a new program shows up with a slow icon.

# $TERMINAL is not set in this session, so console applications need this to
# be launchable at all.
terminal=kitty -e

# Default is overlay, which would draw the launcher over fullscreen windows
# and over lock screens.
layer=top

# Default is filename,name,generic. The rest make the search understand what a
# program is for: "browser" then finds Firefox, "terminal" finds kitty.
fields=name,generic,comment,categories,keywords,filename

# Default is no. Honours OnlyShowIn / NotShowIn against XDG_CURRENT_DESKTOP,
# so entries meant for other desktops stop cluttering the list.
filter-desktop=yes

[colors]
background=ffffff10
text=f5f5f7e6
prompt=ffffff80
placeholder=ffffff50
input=ffffffff
match=ffffffff
selection=ffffff26
selection-text=ffffffff
selection-match=ffffffff
counter=ffffff60
border=ffffff40

[border]
width=3
radius=42
selection-radius=21
