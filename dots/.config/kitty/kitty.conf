# iOS liquid glass - palette shared with waybar / fuzzel / mako / hyprlock.
# Hyprland blurs the real alpha (decoration:blur has ignore_opacity = true),
# so transparency must come from background_opacity here, not a window_rule.

# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
font_size        16.5
adjust_line_height  108%
disable_ligatures never

# --- Glass ---
background_opacity        0.72
background_blur           0
dynamic_background_opacity yes

# --- Window ---
window_padding_width      18 21
placement_strategy        center
hide_window_decorations   yes
confirm_os_window_close   0
remember_window_size      no
initial_window_width      104c
initial_window_height     30c

# --- Cursor ---
# cursor_trail is the animated trail from illogical-impulse (they use `1`).
# decay = min/max seconds the trail takes to catch up; threshold in cells
# before it kicks in, so single-cell typing stays still.
cursor_shape              beam
cursor_beam_thickness     1.6
cursor_trail              1
cursor_trail_decay        0.1 0.4
cursor_trail_start_threshold 2
cursor_blink_interval     0.6
cursor_stop_blinking_after 8.0

# --- Scrollback ---
scrollback_lines          10000
scrollback_pager          less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# --- Bell ---
enable_audio_bell         no
visual_bell_duration      0.0

# --- Mouse ---
mouse_hide_wait           2.0
copy_on_select            no
strip_trailing_spaces     smart

# --- Tabs ---
tab_bar_edge              top
tab_bar_style             powerline
tab_powerline_style       round
tab_bar_min_tabs          2
active_tab_font_style     bold
inactive_tab_font_style   normal

# --- Colors: neutral dark glass, #f5f5f7 foreground like waybar ---
foreground                #f5f5f7
background                #14141a
selection_foreground      #14141a
selection_background      #f5f5f7

cursor                    #f5f5f7
cursor_text_color         #14141a

url_color                 #7ab8ff
url_style                 curly

# kitty takes 6-digit hex only - no alpha channel here.
# These are ffffff40 / ffffff12 pre-blended over the #14141a background,
# so they match the Hyprland window borders.
active_border_color       #4f4f53
inactive_border_color     #25252a

active_tab_foreground     #14141a
active_tab_background     #f5f5f7
inactive_tab_foreground   #f5f5f7
inactive_tab_background   #24242c

# iOS system colors
# black
color0  #1c1c1e
color8  #48484a
# red
color1  #ff453a
color9  #ff6961
# green
color2  #32d74b
color10 #5ce65e
# yellow
color3  #ffd60a
color11 #ffe14d
# blue
color4  #0a84ff
color12 #64a8ff
# magenta
color5  #bf5af2
color13 #d68bf7
# cyan
color6  #64d2ff
color14 #8fe0ff
# white
color7  #e5e5ea
color15 #f5f5f7

# --- Keybindings ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
