# iOS liquid glass - palette shared with waybar / fuzzel / mako / hyprlock.
# Hyprland blurs the real alpha (decoration:blur has ignore_opacity = true),
# so transparency must come from background_opacity here, not a window_rule.

# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
font_size        16.5
adjust_line_height  108%
disable_ligatures never

# --- Glass ---
background_opacity        0.72
background_blur           0
dynamic_background_opacity yes

# --- Window ---
window_padding_width      18 21
placement_strategy        center
hide_window_decorations   yes
confirm_os_window_close   0
remember_window_size      no
initial_window_width      104c
initial_window_height     30c

# --- Cursor ---
# cursor_trail is the animated trail from illogical-impulse (they use `1`).
# decay = min/max seconds the trail takes to catch up; threshold in cells
# before it kicks in, so single-cell typing stays still.
cursor_shape              beam
cursor_beam_thickness     1.6
cursor_trail              1
cursor_trail_decay        0.1 0.4
cursor_trail_start_threshold 2
cursor_blink_interval     0.6
cursor_stop_blinking_after 8.0

# --- Scrollback ---
scrollback_lines          10000
scrollback_pager          less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# --- Bell ---
enable_audio_bell         no
visual_bell_duration      0.0

# --- Mouse ---
mouse_hide_wait           2.0
copy_on_select            no
strip_trailing_spaces     smart

# --- Tabs ---
tab_bar_edge              top
tab_bar_style             powerline
tab_powerline_style       round
tab_bar_min_tabs          2
active_tab_font_style     bold
inactive_tab_font_style   normal

# --- Colors: neutral dark glass ---
# Text sits on a five-step grey ladder shared with fish (see config.fish):
#   4a4a53 ghost · 6a6a70 meta · 8b8b93 structure · b9b9c1 text · e8e8ec emphasis
# The border colours below are not part of it - they are ffffff40 / ffffff12
# pre-blended over the background so they match the Hyprland window borders,
# and changing them would break that match.
foreground                #e8e8ec
background                #14141a
selection_foreground      #14141a
selection_background      #e8e8ec

cursor                    #e8e8ec
cursor_text_color         #14141a

url_color                 #9aa0ad
url_style                 curly

# kitty takes 6-digit hex only - no alpha channel here.
# These are ffffff40 / ffffff12 pre-blended over the #14141a background,
# so they match the Hyprland window borders.
active_border_color       #4f4f53
inactive_border_color     #25252a

active_tab_foreground     #14141a
active_tab_background     #e8e8ec
inactive_tab_foreground   #b9b9c1
inactive_tab_background   #24242c

# Neutral palette. Everything is a grey with a slight temperature bias -
# green cools it, yellow warms it - so tokens stay apart by lightness rather
# than by hue. Only red keeps real saturation, because an error has to shout.
#
# The bias is small on purpose: at this saturation the eye reads the whole
# terminal as grey, which is the point, while ls, diffs and syntax remain
# legible. Push any of these past roughly 20% saturation and the neutrality
# is gone.

# black - the two darkest steps, used for dimmed text and backgrounds
color0  #2b2b33
color8  #6a6a70
# red - the one colour left saturated, for errors and deletions
color1  #b4767d
color9  #cd8d94
# green - cool grey
color2  #8d9689
color10 #a5ada0
# yellow - warm grey
color3  #a99d87
color11 #c2b69e
# blue - the coolest grey, deliberately far from the blue it replaces
color4  #7f8592
color12 #979dab
# magenta - faintly violet grey
color5  #928a97
color13 #aaa1af
# cyan - grey with a green lean
color6  #859290
color14 #9ca9a7
# white
color7  #b9b9c1
color15 #e8e8ec

# --- Keybindings ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
