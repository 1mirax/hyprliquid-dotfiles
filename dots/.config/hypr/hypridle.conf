# IMPORTANT: on this build hyprctl dispatch goes through Lua.
# The classic `hyprctl dispatch dpms on` syntax does NOT work.
# Also hl.dsp.dpms() without an argument TOGGLES the state - in on-resume
# that would blank the screen on wake. Always pass explicit status "on"/"off".

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ status = "on" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 2.5 min - dim the backlight (brightnessctl -s saves the current level)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min - lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min - turn the display off (main battery saver)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ status = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ status = "on" })'
}

# 15 min - suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
