# IMPORTANT: on this build hyprctl dispatch goes through Lua.
# The classic `hyprctl dispatch dpms on` syntax does NOT work.
#
# The key is `action`, and nothing checks that you got the name right: with
# any other key the table is empty as far as the dispatcher is concerned and
# it falls back to toggling. This file said `status` for months, so every
# command here flipped the panel instead of setting it - which is why waking
# from a manual suspend, with the screen still on, landed on a black screen
# often enough to look random. Verified by hand: action "on"/"off" (or
# "enable"/"disable") sets the state and is safe to repeat.

general {
    lock_cmd = pidof hyprlock || hyprlock
    # Two commands, in this order, because going into S3 with the output
    # disabled is what hangs this session: the 5.5 min listener below may
    # already have turned the panel off, and on the way back the compositor
    # stops answering - hyprlock's last frame stays on screen, input does
    # nothing, and the only way out is the power button. Waking the output
    # first costs a fraction of a second of light before the screen sleeps.
    before_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 2.5 min - dim the backlight (brightnessctl -s saves the current level)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min - lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min - turn the display off (main battery saver)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 15 min - suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
