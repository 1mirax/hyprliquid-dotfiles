# The tray icon went missing on every login. Both units start in the same
# second, AmneziaVPN asks the StatusNotifierWatcher to register its icon
# before waybar has created that watcher, is refused, and never asks again.
#
# After=waybar.service is not enough on its own: waybar is Type=simple, so
# systemd considers it started the moment the process is spawned, which is
# well before the tray host claims its bus name. So wait for the name itself,
# up to five seconds, then give up rather than hold the session.
[Unit]
After=waybar.service

[Service]
ExecStartPre=/usr/bin/sh -c 'for i in $(seq 50); do busctl --user list --no-legend | grep -q org.kde.StatusNotifierWatcher && exit 0; sleep 0.1; done; exit 0'
