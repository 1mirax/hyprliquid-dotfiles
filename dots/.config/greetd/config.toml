# greetd runs on VT 1, which is what the shipped greetd.service already
# arranges: it declares Conflicts=getty@tty1.service, so the getty and the
# greeter can never fight over the same terminal. ly sat on VT 2 and needed
# its own unit template for that. Leaving VT 2 and up to the gettys also means
# a rescue console is always one Ctrl+Alt+Fn+F2 away - Fn, because the top row
# of this ThinkPad sends media keys unless FnLock is on.
[terminal]
vt = 1

# The greeter, running as the unprivileged `greeter` user. This is the whole
# point of greetd: the part that runs as root does PAM and nothing else, and
# everything that parses a keystroke or draws a pixel is over here, without
# privileges.
#
# tuigreet and not a graphical greeter, after trying two. gtkgreet under cage
# works, but it is a bare GTK window with three addressable widgets, so every
# pixel is ours to style, and it drags cage and wlroots in for a screen that
# shows for four seconds. regreet looks better untouched but pulls
# accountsservice - another root daemon - and the UPnP stack behind the GTK
# portal. nwg-hello is the closest call: almost no new packages, but Python
# and a whole Hyprland come up before anyone has authenticated.
#
# How it looks and behaves is in /etc/tuigreet/config.toml - see tuigreet.toml
# next to this file. Keeping it there rather than in a command line is why
# this line is one word.
[default_session]
command = "tuigreet"
user = "greeter"
