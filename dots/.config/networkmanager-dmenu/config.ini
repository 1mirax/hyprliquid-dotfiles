# networkmanager_dmenu, styled to match the rest of the setup.
#
# The launcher namespace is what makes Hyprland treat this popup like fuzzel
# itself - same blur, same popin animation - see hypr/modules/rules.lua.
# networkmanager_dmenu appends --dmenu and --placeholder on its own, so only
# the styling belongs here.

[dmenu]
dmenu_command = fuzzel --namespace cheatsheet --width 46 --lines 12
# Marks the active connection. Rofi/Wofi get real highlighting; fuzzel does not,
# so the characters are what actually shows here.
active_chars = ==
highlight = True
compact = False
# Plain block characters rather than Nerd Font wifi glyphs: these render
# identically everywhere and cannot silently turn into the wrong icon.
wifi_chars = ▂▄▆█
format = {name}  {sec}  {bars}
# Saved connections include the WireGuard/amneziawg tunnels, so this is the
# switch that decides whether the VPN lives in this menu too.
list_saved = False
prompt = wifi

[dmenu_passphrase]
# fuzzel gets --password from this, so the key is not echoed.
obscure = True

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 3
notification_timeout = 5
show_notifications = True
